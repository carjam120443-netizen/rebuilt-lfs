name: Rebuilt LFS build

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: ISO name/version suffix
        required: false
        default: dev
  push:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LFS, desktop and ISO build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euxo pipefail
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get clean
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y -o Acquire::Retries=5 \
            build-essential bison gawk texinfo wget curl git xz-utils bzip2 cpio gzip rsync \
            xorriso grub-pc-bin grub-efi-amd64-bin grub-efi-amd64-signed shim-signed \
            dosfstools mtools squashfs-tools bc flex libelf-dev libssl-dev \
            xsltproc docbook-xml docbook-xsl libxml2-utils sudo \
            autoconf automake libtool pkg-config meson ninja-build gettext \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev libxi-dev \
            libxinerama-dev libxcursor-dev libxfixes-dev libxcomposite-dev \
            libxdamage-dev libxss-dev libxkbfile-dev

      - name: Make build scripts executable
        run: |
          set -euxo pipefail
          find scripts packages/porg desktop iso -type f -name '*.sh' -exec chmod +x {} +

      - name: Build complete LFS base with official jhalfs
        env:
          BUILD_DIR: ${{ github.workspace }}/work/lfs-build
          ROOT_DIR: ${{ github.workspace }}/work/rootfs
          JOBS: 2
          LFS_BOOK: 12.4
        run: ./scripts/build-lfs-auto.sh

      - name: Install Rebuilt LFS runtime configuration
        env:
          ROOT_DIR: ${{ github.workspace }}/work/rootfs
        run: ./scripts/build-system.sh

      - name: Install sudo and configure administration
        env:
          ROOT_DIR: ${{ github.workspace }}/work/rootfs
        run: ./scripts/install-sudo.sh

      - name: Install Porg/package tracking
        env:
          ROOT_DIR: ${{ github.workspace }}/work/rootfs
        run: ./packages/porg/build-porg.sh

      - name: Build Xorg and XFCE desktop stack
        env:
          ROOT_DIR: ${{ github.workspace }}/work/rootfs
          SRC_DIR: ${{ github.workspace }}/work/sources
          JOBS: 2
        run: ./desktop/build-xfce.sh

      - name: Install XFCE/LXQt session integration
        env:
          ROOT_DIR: ${{ github.workspace }}/work/rootfs
        run: ./desktop/build-desktops.sh

      - name: Install desktop launcher and shortcuts
        env:
          ROOT_DIR: ${{ github.workspace }}/work/rootfs
        run: ./scripts/enable-desktop.sh

      - name: Build Linux kernel and initramfs
        env:
          ROOT_DIR: ${{ github.workspace }}/work/rootfs
        run: ./iso/build-kernel.sh

      - name: Create bootable BIOS + UEFI ISO
        env:
          ROOT_DIR: ${{ github.workspace }}/work/rootfs
          OUT_DIR: ${{ github.workspace }}/dist
          ISO_NAME: rebuilt-lfs-${{ inputs.release_name || 'dev' }}-x86_64.iso
        run: ./iso/build-iso.sh

      - name: Verify ISO exists
        run: |
          set -euxo pipefail
          ls -lh dist/*.iso
          file dist/*.iso
          test -s dist/*.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-lfs-iso-${{ inputs.release_name || 'dev' }}
          path: dist/*.iso
          if-no-files-found: error
          retention-days: 14
