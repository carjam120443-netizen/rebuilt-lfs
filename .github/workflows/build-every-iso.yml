name: Build Every Rebuilt LFS ISO

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: ISO name/version suffix
        required: false
        default: dev
  push:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ISO and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison gawk texinfo wget xz-utils bzip2 cpio gzip rsync \
            xorriso grub-pc-bin grub-efi-amd64-bin grub-efi-amd64-signed shim-signed \
            dosfstools mtools squashfs-tools bc flex libelf-dev libssl-dev

      - name: Make build scripts executable
        run: chmod +x scripts/*.sh packages/porg/*.sh desktop/*.sh iso/*.sh

      - name: Initialize LFS base
        env:
          ROOT_DIR: ${{ github.workspace }}/work/rootfs
        run: ./scripts/build-base.sh

      - name: Assemble runtime userspace
        env:
          ROOT_DIR: ${{ github.workspace }}/work/rootfs
        run: ./scripts/build-system.sh

      - name: Build and install Porg
        env:
          ROOT_DIR: ${{ github.workspace }}/work/rootfs
        run: ./packages/porg/build-porg.sh

      - name: Stage Xorg and XFCE
        env:
          ROOT_DIR: ${{ github.workspace }}/work/rootfs
        run: ./desktop/build-xfce.sh

      - name: Install desktop launcher and shortcuts
        env:
          ROOT_DIR: ${{ github.workspace }}/work/rootfs
        run: ./scripts/enable-desktop.sh

      - name: Build kernel and initramfs
        env:
          ROOT_DIR: ${{ github.workspace }}/work/rootfs
        run: ./iso/build-kernel.sh

      - name: Create bootable ISO
        env:
          ROOT_DIR: ${{ github.workspace }}/work/rootfs
          OUT_DIR: ${{ github.workspace }}/dist
          ISO_NAME: rebuilt-lfs-${{ inputs.release_name || 'dev' }}-x86_64.iso
        run: ./iso/build-iso.sh

      - name: Verify ISO exists
        run: |
          test -s dist/*.iso
          file dist/*.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-lfs-iso-${{ inputs.release_name || 'dev' }}
          path: dist/*.iso
          if-no-files-found: error
          retention-days: 14
